# ARES on Render — FREE-TIER deploy of the API server (web UI lives on Vercel).
#
# This is the $0 setup: a single free web service running the API. Postgres is
# external (Supabase free tier → DATABASE_URL). No Redis and no scheduler worker,
# because Render has no free worker tier — the API falls back to an in-memory
# queue when REDIS_URL is unset.
#
# Free-tier trade-offs (fine for testing/demo; upgrade later for production):
#   - Spins down after ~15 min idle → first request after that cold-starts (~30-60s)
#     and any open chat (SSE) stream drops while idle.
#   - No persistent disk → the file tools' workspace resets on restart/redeploy.
#   - No autonomy/cron jobs (morning briefing, inbox scan, consolidation).
#   - 512 MB RAM.
#
# Deploy:
#   1. Push this file → Render: New → Blueprint → pick this repo.
#   2. Fill the `sync: false` secrets (API key, CORS origin, provider key, DATABASE_URL).
#   3. Deploy. The API boots via the Dockerfile entrypoint (migrations → serve).
#
# After it's up, set Vercel's NEXT_PUBLIC_ARES_API to the API URL Render gives you
# (e.g. https://ares-api.onrender.com) and set ARES_API_ORIGINS to your Vercel
# URL(s), comma-separated, no trailing slash.
#
# >>> TO SCALE UP LATER (paid): change `plan: free` to `starter`, re-add a `disk:`
#     for a durable workspace, and uncomment the Redis + scheduler-worker blocks
#     at the bottom of this file.

services:
  # --- API server (free web service) ----------------------------------------
  # Built from the root Dockerfile: runs DB migrations on boot, then `npm run serve`.
  - type: web
    name: ares-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon # match this to your Postgres region to cut latency.
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Bind publicly inside the container; guarded by ARES_API_KEY.
      - key: ARES_API_HOST
        value: 0.0.0.0
      # Keep ARES_API_PORT and the PORT Render routes to aligned.
      - key: ARES_API_PORT
        value: "3001"
      - key: PORT
        value: "3001"
      # Ephemeral container-local workspace (no disk on free tier).
      - key: ARES_WORKSPACE_DIR
        value: /data/workspace

      # --- Secrets / per-deploy values (fill in the Render dashboard) ---------
      # Required to bind a non-loopback host — the server refuses to start without it.
      #   generate: openssl rand -base64 32   (>= 16 chars)
      - key: ARES_API_KEY
        sync: false
      # Browser allowlist (CORS). Your Vercel URL(s), comma-separated, no trailing slash.
      #   e.g. https://ares.vercel.app,https://ares.yourdomain.com
      - key: ARES_API_ORIGINS
        sync: false
      # Reasoning provider key. Set at least one (ANTHROPIC_API_KEY by default).
      - key: ANTHROPIC_API_KEY
        sync: false
      # Managed Postgres with pgvector (Supabase connection string). Unset →
      # ephemeral in-memory memory (data lost on restart).
      - key: DATABASE_URL
        sync: false

      # --- Optional capability keys (uncomment in the dashboard as needed) ----
      # - key: OPENAI_API_KEY        # voice STT/TTS + image gen + reasoning fallback
      #   sync: false
      # - key: GEMINI_API_KEY        # reasoning/embeddings/search/voice fallback
      #   sync: false
      # - key: VOYAGE_API_KEY        # embeddings (recommended; else offline hash embedder)
      #   sync: false
      # - key: TAVILY_API_KEY        # web_search
      #   sync: false
      # - key: GITHUB_TOKEN          # github_* developer tools
      #   sync: false

