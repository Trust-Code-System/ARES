# ARES on Render — API server (+ optional scheduler) when the web UI is on Vercel.
#
# Mirrors docker-compose.api.yml: the long-running API server, a managed Redis
# (durable BullMQ scheduler + memory queue), and an optional background worker
# that runs the autonomy daemon (morning briefing, inbox scan, consolidation).
#
# Postgres is NOT defined here — point DATABASE_URL at your managed Postgres with
# pgvector (Supabase, or a Render Postgres with the pgvector extension enabled).
#
# Deploy:
#   1. Push this file, then in Render: New → Blueprint → pick this repo.
#   2. Fill the `sync: false` secrets (API key, provider keys, DATABASE_URL, CORS).
#   3. Deploy. The API boots via the Dockerfile entrypoint (migrations → serve).
#
# After it's up, set Vercel's NEXT_PUBLIC_ARES_API to the API URL Render gives you
# (e.g. https://ares-api.onrender.com) and set ARES_API_ORIGINS below to your
# Vercel URL(s), comma-separated, no trailing slash.

services:
  # --- API server -----------------------------------------------------------
  # Built from the root Dockerfile: runs DB migrations on boot, then `npm run serve`.
  - type: web
    name: ares-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter # NOT free — free instances spin down on idle, killing SSE + the scheduler.
    region: oregon # match this to your Postgres/Redis region to cut latency.
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Bind publicly inside the container; guarded by ARES_API_KEY.
      - key: ARES_API_HOST
        value: 0.0.0.0
      # Render injects $PORT; the server reads ARES_API_PORT. Keep them aligned.
      - key: ARES_API_PORT
        value: "3001"
      - key: PORT
        value: "3001"
      # Container-local workspace for the file tools (read_file/write_file/list_files).
      # Attach a disk so it survives restarts/redeploys.
      - key: ARES_WORKSPACE_DIR
        value: /data/workspace

      # --- Secrets / per-deploy values (fill in the Render dashboard) ---------
      # Required to bind a non-loopback host — the server refuses to start without it.
      #   generate: openssl rand -base64 32   (>= 16 chars)
      - key: ARES_API_KEY
        sync: false
      # Browser allowlist (CORS). Your Vercel URL(s), comma-separated, no trailing slash.
      #   e.g. https://ares.vercel.app,https://ares.yourdomain.com
      - key: ARES_API_ORIGINS
        sync: false
      # Reasoning provider key(s). Set at least one (ANTHROPIC_API_KEY by default).
      - key: ANTHROPIC_API_KEY
        sync: false
      # Managed Postgres with pgvector (Supabase connection string, or a Render
      # Postgres with pgvector enabled). Unset → ephemeral in-memory memory (dev only).
      - key: DATABASE_URL
        sync: false

      # Durable scheduler + memory queue via Render's managed Redis (below).
      - key: REDIS_URL
        fromService:
          type: redis
          name: ares-redis
          property: connectionString

      # --- Optional capability keys (uncomment in the dashboard as needed) ----
      # - key: OPENAI_API_KEY        # voice STT/TTS + image gen + reasoning fallback
      #   sync: false
      # - key: GEMINI_API_KEY        # reasoning/embeddings/search/voice fallback
      #   sync: false
      # - key: VOYAGE_API_KEY        # embeddings (recommended; else offline hash embedder)
      #   sync: false
      # - key: TAVILY_API_KEY        # web_search
      #   sync: false
      # - key: GITHUB_TOKEN          # github_* developer tools
      #   sync: false
    disk:
      name: ares-workspace
      mountPath: /data/workspace
      sizeGB: 1

  # --- Autonomy daemon (OPTIONAL) -------------------------------------------
  # Cron jobs: morning briefing, inbox scan, weekly report, nightly consolidation.
  # Same image as the API; overrides the start command to run the scheduler.
  # Delete this whole block if you don't want the autonomous loop.
  - type: worker
    name: ares-scheduler
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    autoDeploy: true
    # Skip the API entrypoint (migrations are owned by ares-api) and run the daemon.
    dockerCommand: npm run scheduler
    envVars:
      - key: ARES_WORKSPACE_DIR
        value: /data/workspace
      - key: ARES_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: ares-redis
          property: connectionString
      # Optional: enable the webhook trigger layer by setting a secret.
      # - key: ARES_WEBHOOK_SECRET
      #   sync: false

  # --- Managed Redis (BullMQ + memory queue) --------------------------------
  - type: redis
    name: ares-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: noeviction # BullMQ requires keys are not evicted.
    ipAllowList: [] # only reachable from your Render services (no public access).
